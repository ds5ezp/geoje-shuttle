<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거제시종합사회복지관 - 셔틀버스 운행 위치 송신</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
     apiKey: "AIzaSyDIOaN5jLCjjjK-xKUi4Bb-f4597panqDo",
      authDomain: "gjcwbus.firebaseapp.com",
      databaseURL: "https://gjcwbus-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gjcwbus",
      storageBucket: "gjcwbus.firebasestorage.app",
      messagingSenderId: "427511689115",
      appId: "1:427511689115:web:f409857185be5668d1fb3e",
      measurementId: "G-8RNZ3ESW56"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let watchId = null;

    window.startDriving = function() {
      const courseName = document.getElementById('driverCourseSelect').value;
      const busNumber = document.getElementById('busNumberInput').value.trim() || '셔틀버스';
      const statusText = document.getElementById('statusText');

      if (!navigator.geolocation) {
        alert("이 기기에서는 위치 정보를 지원하지 않습니다.");
        return;
      }

      statusText.innerText = `[${courseName} / ${busNumber}] 위치 전송 중... (GPS 수신 대기)`;
      statusText.style.color = "#10b981";

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const timestamp = new Date().toLocaleTimeString();

          set(ref(db, 'liveBuses/' + courseName), {
            lat: lat,
            lng: lng,
            busNumber: busNumber, // ⭐️ 차량 번호 함께 전송
            updatedAt: timestamp
          }).then(() => {
            statusText.innerText = `[${courseName} - ${busNumber}] 전송 성공 (${timestamp})\n위도: ${lat.toFixed(4)}, 경도: ${lng.toFixed(4)}`;
          }).catch((error) => {
            statusText.innerText = "전송 실패: " + error.message;
            statusText.style.color = "#ef4444";
          });
        },
        (error) => {
          statusText.innerText = "GPS 오류: " + error.message;
          statusText.style.color = "#ef4444";
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
      );
    };

    window.stopDriving = function() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById('statusText').innerText = "운행이 중단되었습니다.";
        document.getElementById('statusText').style.color = "#64748b";
      }
    };
  </script>

  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; background: #0f172a; color: #fff; }
    h2 { margin-bottom: 20px; }
    select, input, button { width: 100%; max-width: 320px; padding: 14px; margin: 10px 0; font-size: 1rem; border-radius: 10px; border: none; font-weight: bold; box-sizing: border-box; }
    select, input { background: #334155; color: #fff; text-align: center; outline: none; }
    input::placeholder { color: #94a3b8; }
    .start-btn { background: #10b981; color: #fff; cursor: pointer; }
    .stop-btn { background: #ef4444; color: #fff; cursor: pointer; }
    #statusText { margin-top: 20px; font-size: 0.95rem; line-height: 1.5; color: #94a3b8; }
  </style>
</head>
<body>
  <h2>🚌 기사님 위치 송신 앱</h2>
  <p>노선과 차량 번호를 입력 후 운행을 시작하세요.</p>
  
  <select id="driverCourseSelect">
    <option value="고현·장평(오전)">고현·장평(오전)</option>
    <option value="수월·연초">수월·연초</option>
    <option value="둔덕·사등">둔덕·사등</option>
  </select>

  <input type="text" id="busNumberInput" placeholder="차량번호 입력 (예: 74바 1748)">

  <button class="start-btn" onclick="startDriving()">운행 시작 (위치 송신)</button>
  <button class="stop-btn" onclick="stopDriving()">운행 중단</button>

  <div id="statusText">대기 중...</div>
</body>
</html>
