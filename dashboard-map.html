<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>셔틀 차량 위치 (업무포털용)</title>
  <!--
    복지사업팀 업무포털(구글 앱스 스크립트)의 '셔틀버스 실시간운행관리' 화면 안에 띄우는 지도.
    카카오 지도 키가 ds5ezp.github.io 에만 허용되어 있어, 지도는 이 GitHub 페이지에서 그리고 업무포털은 이 페이지를 불러옴.
    승객 화면과 같은 공개 데이터(publicLiveStatus)만 읽음.
  -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f01d8615df654cbc9c30cca0069570ba"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
    #map { width: 100%; height: 100%; }
    #msg { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(255,255,255,.95); padding: 6px 10px; border-radius: 8px; font-size: 12px; color: #4e5968; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="msg">불러오는 중…</div>
  <script>
    const FIREBASE_URL = 'https://gjcwbus-default-rtdb.asia-southeast1.firebasedatabase.app';
    const CENTER = { lat: 34.8872, lng: 128.625 };
    let map = null;
    let overlays = [];
    let fitted = false;

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function kstTime(ms) {
      return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ms));
    }

    // 업무포털 표와 같은 기준: 45초 안 = 운행 중, 30분 안 = 신호 지연, 그 외 운행 종료(오늘 운행한 차량만)
    function toPoints(live) {
      const now = Date.now();
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date(now));
      const points = [];
      Object.keys(live || {}).forEach(course => {
        Object.keys(live[course] || {}).forEach(round => {
          const pos = (live[course][round] || {}).busPosition || {};
          const lat = Number(pos.lat), lng = Number(pos.lng), updated = Number(pos.updatedAt) || 0;
          if (!lat || !lng || !updated) return;
          const operating = pos.isOperating === true || pos.isOperating === 'true';
          const age = now - updated;
          let status, color;
          if (operating && age < 45000) { status = '운행 중'; color = '#198754'; }
          else if (operating && age < 1800000) { status = '신호 지연'; color = '#fd7e14'; }
          else if (new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date(updated)) === today) { status = '운행 종료'; color = '#6c757d'; }
          else return;
          points.push({ lat, lng, course, round: pos.round || round, bus: pos.busNumber || '-', status, color });
        });
      });
      return points;
    }

    function draw(points) {
      if (!map) {
        map = new kakao.maps.Map(document.getElementById('map'), { center: new kakao.maps.LatLng(CENTER.lat, CENTER.lng), level: 6 });
        map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      }
      overlays.forEach(o => o.setMap(null));
      overlays = points.map(p => {
        const el = document.createElement('div');
        el.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
        el.title = p.course + ' ' + p.round + ' · ' + p.bus + ' · ' + p.status;
        el.innerHTML =
          '<div style="width:28px;height:28px;border-radius:50%;background:' + p.color + ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:14px;">🚌</div>' +
          '<div style="margin-top:3px;background:#fff;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2);">' + esc(p.course + ' ' + p.round) + '</div>';
        const o = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(p.lat, p.lng), content: el, yAnchor: 0.5, xAnchor: 0.5 });
        o.setMap(map);
        return o;
      });
      // 처음 한 번만 차량이 다 보이게 맞추고, 이후에는 사용자가 움직인 위치를 유지
      if (points.length && !fitted) {
        const bounds = new kakao.maps.LatLngBounds();
        points.forEach(p => bounds.extend(new kakao.maps.LatLng(p.lat, p.lng)));
        map.setBounds(bounds, 40);
        fitted = true;
      }
    }

    function refresh() {
      fetch(FIREBASE_URL + '/publicLiveStatus.json')
        .then(r => r.json())
        .then(live => {
          const points = toPoints(live);
          draw(points);
          document.getElementById('msg').textContent = kstTime(Date.now()) + ' 기준 · 지도 차량 ' + points.length + '대';
        })
        .catch(err => { document.getElementById('msg').textContent = '위치를 불러오지 못했습니다: ' + err.message; })
        .finally(() => setTimeout(refresh, 15000));
    }

    if (window.kakao && kakao.maps) refresh();
    else document.getElementById('msg').textContent = '카카오지도를 불러오지 못했습니다.';
  </script>
</body>
</html>
